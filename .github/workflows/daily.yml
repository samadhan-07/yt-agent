name: daily-video
on:
  schedule:
    # All times are UTC. Odd minutes avoid GitHub's busy start-of-hour queue, and 02:00-09:00 UTC
    # is night in the USA, when Google's APIs are usually least busy.
    # Each run makes ONE video and books the next free public slot (config.yaml: publish_times_ist).
    - cron: "47 2 * * *"    # 08:17 IST -> goes public 13:00 IST
    - cron: "23 4 * * *"    # 09:53 IST -> goes public 18:30 IST
    - cron: "11 6 * * *"    # 11:41 IST -> goes public 21:00 IST
    - cron: "37 8 * * *"    # 14:07 IST -> goes public 08:00 IST next morning
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic (leave empty to use topics.txt / let the AI choose)"
        type: string
        default: ""
      language:
        description: "Language for narration and script"
        type: choice
        options: ["hi", "en", "es"]
        default: "hi"
      cartoon_style:
        description: "Visual style theme for the AI images"
        type: choice
        options: ["Colorful 2D cartoon", "None (Realistic)"]
        default: "Colorful 2D cartoon"
      character:
        description: "Add the cartoon mascot and cartoon voice"
        type: boolean
        default: true
      dry_run:
        description: "Render only, do not upload"
        type: boolean
        default: false
      force:
        description: "Upload even if a video was already uploaded today"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: daily-video
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # fonts-noto-core contains Noto Sans Devanagari (Hindi captions)
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core
      - run: pip install -r requirements.txt
      - name: Generate and upload
        run: python -m src.main
        env:
          TOPIC: ${{ github.event_name == 'workflow_dispatch' && inputs.topic || '' }}
          VIDEO_LANGUAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.language || 'hi' }}
          CARTOON_STYLE: ${{ github.event_name == 'workflow_dispatch' && inputs.cartoon_style || 'Colorful 2D cartoon' }}
          CHARACTER: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.character) || 'true' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        with:
          name: preview
          path: out/preview.mp4
      - name: Save history
        if: ${{ always() }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add state/history.json || true
          git diff --cached --quiet || (git commit -m "update history" && git pull --rebase && git push)
