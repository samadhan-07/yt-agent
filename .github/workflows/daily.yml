name: daily-video
on:
  schedule:
    - cron: "30 3 * * *"        # 09:00 IST daily; edit as needed
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic (leave empty to let the AI choose)"
        type: string
        default: ""
      dry_run:
        description: "Render only, do not upload"
        type: boolean
        default: true
permissions:
  contents: write
concurrency: daily-video
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: Generate and upload
        run: python -m src.main
        env:
          TOPIC: ${{ github.event_name == 'workflow_dispatch' && inputs.topic || '' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        with:
          name: preview
          path: out/preview.mp4
      - name: Save history
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add state/history.json || true
          git diff --cached --quiet || (git commit -m "update history" && git push)
