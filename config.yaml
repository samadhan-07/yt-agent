# ---- Channel / content ----
series: "Quiet Thresholds"
niche: "philosophical short stories, existential psychology, and literature-inspired thought experiments exploring meaning, time, loneliness, mortality, and the human condition"
style_notes: "Calm, literary, and deeply empathetic. Begin with a quiet, relatable human moment or fictional character facing an inner dilemma, then gradually zoom out to connect their experience to timeless philosophy (Camus, Kierkegaard, Jung, Dostoevsky, Viktor Frankl, Alan Watts). Avoid hype, loud hooks, or preachy self-help clichés."
language: en                      # en / hi / es (workflow input can override this)
voice: en-US-BrianMultilingualNeural
target_seconds: 180               # 3-minute narrative essay (set to 58 if keeping Shorts)
videos_per_run: 1                 # 1 deep philosophical essay per run

# Locked visual aesthetic applied to every Pollinations FLUX scene
visual_style: "flat 2D surrealist editorial vector illustration, muted slate blue and warm ochre color palette, minimalist geometric shapes, atmospheric lighting, subtle paper grain texture, horizontal 16:9, no text, no captions, no logos"

# ---- LLM (Google AI Studio) ----
gemini_models: ["gemini-3.8-flash", "gemini-3.5-flash-lite", "gemini-3.5-flash", "gemini-2.5-flash"]

# ---- AI images (Pollinations / FLUX) ----
image_model: flux
image_delay_seconds: 16           # anonymous tier ~1 req / 15 s; lower if POLLINATIONS_API_KEY is set

# ---- YouTube ----
privacy: public                   # used when scheduling is off or forced; scheduled videos stay private until slot
category_id: "27"                 # 27 = Education
extra_tags: [philosophy, psychology, existentialism, meaning of life, storytelling, video essay]
disclosure_line: "AI-assisted visuals and narration."

# ---- Mascot disabled + meditative narrator voice ----
character:
  enabled: false                  # disables cartoon mascot overlay
  size: 600
  bottom_margin: 430
cartoon_voices:
  hi: hi-IN-MadhurNeural
  en: en-US-BrianMultilingualNeural
  es: es-ES-AlvaroNeural
voice_pitch: "+0Hz"               # keep at 0Hz to avoid metallic artifacts in edge-tts
voice_rate: "-6%"                 # slightly slower, contemplative cadence

# ---- Narrative formats (rotates automatically every run) ----
formats:
  - "Philosophical Parable: tell a quiet fictional story about an ordinary person, then reveal how Albert Camus or Søren Kierkegaard explains their struggle"
  - "Psychological Mirror: explore a subtle modern habit (overthinking, nostalgia, perfectionism) through Carl Jung or Viktor Frankl"
  - "Thought Experiment: place the viewer inside a surreal metaphor about time, memory, or choice, then unpack its existential meaning"
  - "Literary Reflection: weave a central idea from Dostoevsky, Kafka, or Tolstoy into a comforting modern reflection"
  - "Eastern & Stoic Perspective: contrast the modern urge to control everything with Taoist, Zen, or Stoic acceptance"

# ---- YouTube audience ----
made_for_kids: false

# ---- Scheduled release ----
schedule_publish: true
publish_times_ist:
  - "21:00"                       # late-evening slot fits reflective, long-form viewing

# ---- End-screen banner disabled for clean cinematic fade-out ----
cta:
  enabled: false
  mode: end
  seconds: 4
  bottom_margin: 300
